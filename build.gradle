subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    group = 'org.boxtheta.javapower'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(27) }
        withSourcesJar()
        withJavadocJar()
    }
    // Published as org.boxtheta.javapower:javapower-<module>.
    base { archivesName = "javapower-${project.name}" }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "javapower-${project.name}"
                from components.java
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-serial,-this-escape', '-Werror']
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    test {
        useJUnitPlatform()
        maxHeapSize = '4g'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
    if (name != 'core') {
        dependencies { api project(':core') }
    }
}
project(':app') {
    apply plugin: 'application'
    dependencies {
        implementation project(':cpu-int')
        implementation project(':cpu-fpvec')
        implementation project(':platform')
    }
    application { mainClass = 'javapower.app.Main' }
}
