subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    group = 'org.boxtheta.javapower'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(27) }
        withSourcesJar()
        withJavadocJar()
    }
    // Published as org.boxtheta.javapower:javapower-<module>.
    base { archivesName = "javapower-${project.name}" }
    // Every published jar (classes, sources, javadoc) carries the license.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { into 'META-INF' }
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "javapower-${project.name}"
                from components.java
                pom {
                    name = "javapower-${project.name}"
                    description = 'A JVM-based Power ISA (POWER9 pseries) emulator'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                }
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-serial,-this-escape', '-Werror']
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    test {
        useJUnitPlatform()
        maxHeapSize = '4g'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
    if (name != 'core') {
        dependencies { api project(':core') }
    }
}
// The embedding entry point: one artifact that pulls in everything.
project(':emulator') {
    dependencies {
        api project(':cpu-int')
        api project(':cpu-fpvec')
        api project(':platform')
    }
}
project(':app') {
    apply plugin: 'application'
    dependencies {
        implementation project(':emulator')
    }
    application { mainClass = 'org.boxtheta.javapower.app.Main' }
}
