// Shadow relocates the bundled ASM into cpu-int (see cpu-int/build.gradle); it is not applied
// as a plugin, only its task type is used.
plugins {
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    group = 'org.boxtheta.javapower'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
    java {
        // Compiled and tested with JDK 21, the oldest supported runtime; `test27` also runs the
        // tests on JDK 27.
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        withSourcesJar()
        withJavadocJar()
    }
    // Published as org.boxtheta.javapower:javapower-<module>.
    base { archivesName = "javapower-${project.name}" }
    // Every published jar (classes, sources, javadoc) carries the license and the notice.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { into 'META-INF' }
        from(rootProject.file('NOTICE')) { into 'META-INF' }
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "javapower-${project.name}"
                from components.java
                pom {
                    name = "javapower-${project.name}"
                    description = 'A JVM-based Power ISA (POWER9 pseries) emulator'
                    // The rest of what Maven Central requires of a POM.
                    url = 'https://github.com/boxtheta/javapower'
                    inceptionYear = '2026'
                    organization {
                        name = 'Box Theta'
                        url = 'https://github.com/boxtheta'
                    }
                    developers {
                        developer {
                            name = 'Box Theta'
                            organization = 'Box Theta'
                            organizationUrl = 'https://github.com/boxtheta'
                        }
                    }
                    scm {
                        url = 'https://github.com/boxtheta/javapower'
                        connection = 'scm:git:https://github.com/boxtheta/javapower.git'
                        developerConnection = 'scm:git:ssh://git@github.com/boxtheta/javapower.git'
                    }
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                }
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-serial,-this-escape', '-Werror']
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '4g'
        testLogging { events 'failed'; exceptionFormat = 'full' }
    }
    // The same tests on JDK 27, as part of `check`.
    def test27 = tasks.register('test27', Test) {
        description = 'Runs the tests on JDK 27.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(27) }
        shouldRunAfter tasks.named('test')
    }
    tasks.named('check') { dependsOn test27 }
    if (name != 'core' && name != 'firmware-slof') {
        dependencies { api project(':core') }
    }
}
// core and cpu-int are multi-release jars. src/main/java22 holds the few classes that differ on
// Java 22 and later (guest RAM as a MemorySegment rather than heap arrays); they go to
// META-INF/versions/22. `test` runs on Java 21 against the base classes, `test27` on JDK 27
// against the versioned ones, and `validateMultiRelease` checks that both versions of each class
// have the same public API.
configure([project(':core'), project(':cpu-int')]) {
    sourceSets {
        java22 {
            java { srcDirs = ['src/main/java22'] }
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }
    tasks.named('compileJava22Java') {
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(27) }
        options.release = 22
    }
    tasks.named('jar') {
        into('META-INF/versions/22') { from sourceSets.java22.output }
        manifest { attributes('Multi-Release': 'true') }
    }
    tasks.named('sourcesJar') {
        into('META-INF/versions/22') { from sourceSets.java22.allSource }
    }
    tasks.named('test27') {
        classpath = sourceSets.java22.output + classpath
    }
    def validate = tasks.register('validateMultiRelease', Exec) {
        description = 'Checks the multi-release jar with jar --validate.'
        group = 'verification'
        def jarFile = tasks.named('jar').flatMap { it.archiveFile }
        def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(27) }
        inputs.file(jarFile)
        doFirst {
            executable jdk.get().metadata.installationPath.file('bin/jar').asFile
            args '--validate', '--file', jarFile.get().asFile
        }
    }
    tasks.named('check') { dependsOn validate }
}

// The embedding entry point: one artifact that pulls in everything.
project(':emulator') {
    dependencies {
        api project(':cpu-int')
        api project(':cpu-fpvec')
        api project(':platform')
    }
}
project(':app') {
    apply plugin: 'application'
    dependencies {
        implementation project(':emulator')
    }
    application { mainClass = 'org.boxtheta.javapower.app.Main' }
}
